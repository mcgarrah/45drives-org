title: "45Drives Open Source"
tagline: "An independent showcase of the open-source stack behind 45Drives storage"
description: >
  Ceph, ZFS, and Cockpit/Houston UI are the real, auditable, community-driven technologies
  underneath 45Drives' storage servers. This is an independent, community-built site exploring
  that stack — not an official 45Drives property.
lang: "en"
url: "https://45drives.org"
baseurl: ""

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

seo:
  type: WebSite

# GitHub Discussions-based commenting (giscus.app). Renders on every page by default;
# set `comments: false` in a page's front matter to opt out (e.g. about.md, legal pages).
giscus:
  repo: mcgarrah/45drives-org
  repo_id: R_kgDOUQOOuA
  category: Announcements
  category_id: DIC_kwDOUQOOuM4DFA_0
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  emit_metadata: 0
  input_position: bottom
  theme: preferred_color_scheme
  lang: en
  loading: lazy

# The `technology` collection holds one page per open-source component of the stack
# (Ceph, ZFS, Cockpit/Houston UI today; Samba, NFS, S3/RGW, monitoring, etc. can be
# added later just by dropping a new file in _technology/ — no layout/nav code changes
# needed beyond adding one line to _data/nav.yml).
collections:
  technology:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
