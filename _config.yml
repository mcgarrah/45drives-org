title: "45Drives Open Source"
tagline: "An independent showcase of the open-source stack behind 45Drives storage"
description: >
  Ceph, ZFS, and Cockpit/Houston UI are the real, auditable, community-driven technologies
  underneath 45Drives' storage servers. This is an independent, community-built site exploring
  that stack — not an official 45Drives property.
lang: "en"
url: "https://45drives.org"
baseurl: ""

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

seo:
  type: WebSite

# The `technology` collection holds one page per open-source component of the stack
# (Ceph, ZFS, Cockpit/Houston UI today; Samba, NFS, S3/RGW, monitoring, etc. can be
# added later just by dropping a new file in _technology/ — no layout/nav code changes
# needed beyond adding one line to _data/nav.yml).
collections:
  technology:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
